name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastUpdated 需要完整 git 历史

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run docs:build

      - name: Rsync to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          : "${SSH_KEY:?缺少仓库 Secret DEPLOY_SSH_KEY}" "${DEPLOY_HOST:?缺少仓库 Secret DEPLOY_HOST}" "${DEPLOY_USER:?缺少仓库 Secret DEPLOY_USER}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # 服务器主机公钥（公开信息，用于防中间人）
          echo "$DEPLOY_HOST ssh-rsa ' > ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            .vitepress/dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/learn/"
