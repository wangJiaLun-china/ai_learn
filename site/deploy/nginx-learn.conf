# learn.wangjialun.top — VitePress 静态知识站（由 GitHub Actions rsync 到 /var/www/learn）
server {
    server_name learn.wangjialun.top;

    root /var/www/learn;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/learn.wangjialun.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/learn.wangjialun.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = learn.wangjialun.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name learn.wangjialun.top;
    return 404; # managed by Certbot


}